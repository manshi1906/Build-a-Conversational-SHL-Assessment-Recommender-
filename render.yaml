# render.yaml -- one-click deploy on Render (free tier).
# Railway/Fly/HF Spaces: use the same start command.
services:
  - type: web
    name: shl-recommender
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/seed_catalog.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false        # set in dashboard
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_TURNS
        value: "8"
      - key: PYTHON_VERSION
        value: 3.12.7
